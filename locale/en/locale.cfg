[mod-setting-description]
exteros-qol-even-distribution-enabled=Enables even distribution of items when using Ctrl + Mouse.
exteros-qol-debug=Shows detailed technical logs in the console.
exteros-qol-squeak-through-enabled=Allows the player to walk between buildings, pipes, and trees by slightly shrinking collision boxes.
exteros-qol-cheat-mode-enabled=Enables additional cheat settings (reach, speed, etc.). Must be ON to use any cheats.
exteros-qol-auto-deconstruct-enabled=Automatically marks mining drills for deconstruction when they run out of resources.
exteros-qol-inventory-repair-enabled=Automatically repairs damaged placeable entity items in your inventory using repair packs.
exteros-qol-time-controls-enabled=Adds buttons to the top left to control game speed.
exteros-qol-auto-alt-enabled=Automatically enables Alt mode (entity info overlays) when joining a game.
exteros-qol-auto-sort-inventory=Automatically sort container inventories when opened. SHIFT+I always manually sorts regardless of this setting.
exteros-qol-item-count-enabled=Shows count of held item in inventory (and vehicle trunk) in the center of the screen.
exteros-qol-searchlight-enabled=Character automatically faces the selected entity.
exteros-qol-force-insert-enabled=Lets fast transfer put items past a container's red bar limit. Works with SHIFT+click and CTRL+click, and while dragging across entities in the world.
exteros-qol-force-insert-always=When off, a transfer is forced only once nothing fits any more; a second click within the action window forces it even when there is still room. When on, every transfer ignores the bar.
exteros-qol-force-insert-window=How long a click or a drag counts as one continuous action. (60 = 1 second)
exteros-qol-wire-shortcuts-enabled=Adds a hotkey that puts a wire in your cursor and cycles between wire types. Default ALT + W, rebindable in Options > Controls > Mods.
exteros-qol-wire-cycle-copper=Cycles through red, green and copper wire. When off, cycles between red and green only.
exteros-qol-planner-zapper-enabled=Dropping a blueprint, blueprint book, deconstruction planner, upgrade planner or selection tool destroys it instead of leaving it on the ground.
exteros-qol-quality-scroll-enabled=Adds hotkeys that swap the item in your cursor for the same item of another quality, if you have one in your inventory. Default CONTROL + SHIFT + mouse wheel.
exteros-qol-hub-button-visible=Shows the QoL button in the top-left corner. When off, open the hub with the hotkey (default SHIFT + E), rebindable in Options > Controls > Mods.
exteros-qol-cheat-productivity-unlocked=Allows using productivity modules in ALL recipes. (Requires Cheat Mode)
exteros-qol-cheat-productivity-cap=Sets the maximum productivity percentage for recipes. (Requires Cheat Mode)
exteros-qol-cheat-stack-size-mode=Choose whether to multiply original stack sizes or set an absolute value. (Requires Cheat Mode)
exteros-qol-cheat-stack-size-value=The multiplier or absolute value for stack sizes. (Requires Cheat Mode)
even-distribution-ticks=How long (in ticks) the mod waits after the last click before distributing items. (60 = 1 second)
even-distribution-swap-balance=If enabled, Ctrl+M1 will be Balanced mode and Ctrl+M2 will be Even mode.
cheat-reach-distance=Increases the distance for building, reaching items, and looting.
cheat-crafting-speed=Increases the manual crafting speed of the player.
cheat-mining-speed=Increases the manual mining speed of the player.
cheat-inventory-bonus=Adds extra slots to the player's inventory.
exteros-qol-inventory-repair-interval=How often (in ticks) the mod checks your inventory and performs a "tick" of repair.
exteros-qol-inventory-repair-order=Choose whether to use the weakest or strongest repair packs first.
exteros-qol-copy-chest-enabled=Adds hotkeys that move the entire contents of one container into another. Default SHIFT + C and SHIFT + V, rebindable in Options > Controls > Mods.
exteros-qol-copy-chest-between-surfaces=Allows moving contents between containers on different surfaces. When off, both containers and the player must be on the same surface.
exteros-qol-belt-reverser-enabled=Adds a hotkey that reverses the direction of an entire transport line, including underground belts and loaders. Default CONTROL + R, rebindable in Options > Controls > Mods. Automatically disabled when a dedicated belt reverser mod is installed.
exteros-qol-player-colors-enabled=Sets your character and chat colour when your character is first created, and whenever you change these settings.
exteros-qol-character-color=Colour of your character. Pick "custom" to use the hex code below, or "default" to leave your colour untouched.
exteros-qol-character-color-hex=Your own colour as a hex code, for example #E08A2E. Only used when the setting above is set to "custom".
exteros-qol-chat-color=Colour of your name in chat. Pick "custom" to use the hex code below, or "default" to leave it untouched.
exteros-qol-chat-color-hex=Your own chat colour as a hex code, for example #4A7FD9. Only used when the setting above is set to "custom".
exteros-qol-renamer-enabled=Adds a hotkey that opens a small window for renaming the entity under your cursor, for anything that carries a name such as a train stop or a roboport. Default CONTROL + SHIFT + R, rebindable in Options > Controls > Mods. Automatically disabled when the Renamer mod is installed.
exteros-qol-chest-limit-enabled=While you hold a container, a small window lets you set how many of its slots stay blocked. Every container of that kind you build afterwards starts with that many slots blocked off.
exteros-qol-belt-brush-enabled=While you hold a belt, underground belt, pipe-to-ground, loader, wall, heat pipe, or inserter, a small window lets you pick a lane count, replacing your cursor with a temporary blueprint that paints that many lanes side by side. Default CONTROL + SHIFT + B cycles between straight, corner, and underground/pipe shapes, and default CONTROL + SHIFT + N cycles through balancers or the cascade shape, both rebindable in Options > Controls > Mods. Automatically disabled when the Belt Brush mod is installed. The brush width is changed with ALT + mouse wheel, or with + and - on the numeric keypad.

