[mod-setting-description]
exteros-qol-even-distribution-enabled=Enables even distribution of items when using Ctrl + Mouse.
exteros-qol-debug=Shows detailed technical logs in the console.
exteros-qol-squeak-through-enabled=Allows the player to walk between buildings, pipes, and trees by slightly shrinking collision boxes.
exteros-qol-auto-deconstruct-enabled=Automatically marks mining drills for deconstruction when they run out of resources.
exteros-qol-inventory-repair-enabled=Automatically repairs damaged placeable items in your inventory using repair packs.
exteros-qol-time-controls-enabled=Adds buttons to the top left to control game speed. Only admins can change the game speed.
exteros-qol-auto-alt-enabled=Automatically enables Alt mode (building info overlays) when joining a game.
exteros-qol-auto-sort-inventory=Automatically sort container inventories when opened. SHIFT+I always manually sorts regardless of this setting.
exteros-qol-item-count-enabled=Shows count of held item in inventory (and vehicle trunk) in the center of the screen.
exteros-qol-item-count-format=How counts are shown: 1,234 / 1.234 / 1 234 / 1234 / 1.2k. Default: 1,234.
exteros-qol-auto-alt-player=Lets you opt out of Auto Alt Mode even while the server has it on. Default: on.
exteros-qol-chest-limit-player=Lets you opt out of Chest Limit even while the server has it on. Default: on.
exteros-qol-searchlight-enabled=Character automatically faces the selected building.
exteros-qol-force-insert-enabled=Lets fast transfer put items past a container's slot limit. Works with SHIFT+click, CTRL+click, and while dragging across buildings.
exteros-qol-force-insert-always=When off, a transfer is forced only once nothing fits any more; a second click within the action window forces it even when there is still room. When on, every transfer ignores the limit.
exteros-qol-force-insert-window=How long a click or a drag counts as one continuous action. (60 = 1 second)
exteros-qol-wire-shortcuts-enabled=Adds a hotkey that puts a wire in your cursor and cycles between wire types. Default ALT + W.
exteros-qol-wire-cycle-copper=Cycles through red, green and copper wire. When off, cycles between red and green only.
exteros-qol-planner-zapper-enabled=Dropping a blueprint, blueprint book, deconstruction planner, upgrade planner or selection tool destroys it instead of leaving it on the ground.
exteros-qol-quality-scroll-enabled=Adds hotkeys that swap the item in your cursor for the same item of another quality, if you have one in your inventory. Default CONTROL + SHIFT + mouse wheel.
even-distribution-ticks=How long (in ticks) the mod waits after the last click before distributing items. (60 = 1 second)
even-distribution-swap-balance=If enabled, Ctrl+M1 will be Balanced mode and Ctrl+M2 will be Even mode.
exteros-qol-inventory-repair-interval=How often (in ticks) the mod checks your inventory and performs a "tick" of repair.
exteros-qol-inventory-repair-order=Choose whether to use the weakest or strongest repair packs first.
exteros-qol-copy-chest-enabled=Adds hotkeys that move the entire contents of one container into another. Default SHIFT + C and SHIFT + V.
exteros-qol-copy-chest-between-surfaces=Allows moving contents between containers on different surfaces. When off, both containers and the player must be on the same surface.
exteros-qol-belt-reverser-enabled=Adds a hotkey that reverses the direction of an entire transport line, including underground belts and loaders. Default CONTROL + R.
exteros-qol-player-colors-enabled=Sets your character and chat colour when your character is first created, and whenever you change these settings.
exteros-qol-character-color=Colour of your character. Pick "custom" to use the hex code below, or "default" to leave your colour untouched.
exteros-qol-character-color-hex=Your own colour as a hex code, for example #E08A2E. Only used when the setting above is set to "custom".
exteros-qol-chat-color=Colour of your name in chat. Pick "custom" to use the hex code below, or "default" to leave it untouched.
exteros-qol-chat-color-hex=Your own chat colour as a hex code, for example #4A7FD9. Only used when the setting above is set to "custom".
exteros-qol-renamer-enabled=Adds a hotkey that opens a small window for renaming the building under your cursor, for anything that carries a name such as a train stop or a roboport. Default CONTROL + SHIFT + R.
exteros-qol-chest-limit-enabled=While you hold a container, a small window lets you set how many of its slots stay blocked. Every container of that kind you build afterwards starts with that many slots blocked off.
exteros-qol-belt-brush-enabled=While you hold a belt, underground belt, pipe-to-ground, loader, wall, heat pipe, or inserter, a small window lets you pick a lane count and paints that many lanes side by side. Defaults: CONTROL + SHIFT + B cycles the shape, CONTROL + SHIFT + N cycles balancers, ALT + mouse wheel changes the width.
exteros-qol-rate-calculator-enabled=Select machines with the Rate Calculator tool (ALT + X or the toolbar shortcut) to see their combined production and consumption rates. Based on Rate Calculator by raiguard.
exteros-qol-rcalc-dismiss-tool-on-selection=After selecting an area, the Rate Calculator tool will automatically be dismissed from your cursor.
exteros-qol-rcalc-show-calculation-errors=If problems are detected while performing calculations, they will be displayed in the GUI.
exteros-qol-rcalc-show-power-consumption=Display power consumption rate in the GUI. Disabled by default because it isn't useful very often.
exteros-qol-rcalc-default-gui-location=You can reset the GUI to its default location at any time by middle-clicking the titlebar.
exteros-qol-rcalc-default-timescale=Unit the rates are shown in when a new Rate Calculator window opens. Each window's timescale can still be changed afterwards from its titlebar.
exteros-qol-rcalc-show-completion-checkboxes=Adds a checkbox next to each row so you can mark items as done while working through the list.
exteros-qol-rcalc-show-intermediate-breakdowns=Shows a column with the input and output rate of each intermediate product.
exteros-qol-rcalc-show-pollution=Display the pollution rate in the GUI.
exteros-qol-ghost-builder-enabled=While your mouse hovers over a ghost (or a real building marked for upgrade) and you carry the right item, it gets built or upgraded instantly, no need to pick the item into your hand first. Default toggle hotkey CONTROL + SHIFT + G.
exteros-qol-ghost-builder-entities=Builds building ghosts you hover over when you carry the item they need.
exteros-qol-ghost-builder-upgrades=Applies upgrade planner requests on buildings you hover over when you carry the target item, and gives you back the replaced item.
exteros-qol-ghost-builder-tiles=Builds tile ghosts you hover over when you carry the item they need, and gives you back whatever the replaced tile would have dropped.
exteros-qol-ghost-builder-modules=Fills a building's empty module slots from your inventory according to its item requests: right after Ghost Builder builds it, after you build it normally, and when you hover over an already-built machine that is still waiting for modules.
exteros-qol-ghost-builder-pickup=The pipette hotkey also picks up an item lying on the ground under your cursor, in addition to its normal behaviour.
exteros-qol-planner-menu-enabled=Adds a hotkey that opens a window with every planner and selection tool in the game, vanilla and modded; click one to take it into your hand, plus hotkeys to cycle through them. Default toggle CONTROL + B, cycle ALT + Q / ALT + SHIFT + Q.
exteros-qol-planner-menu-columns=How many slot buttons the Planner Menu window shows per row.
exteros-qol-tape-measure-enabled=Adds a selection tool (also reachable from the Planner Menu) that shows width, height and tile count of a dragged rectangle; alt-drag keeps the measurement drawn until the next one. Default hotkey CONTROL + SHIFT + M.

