[exteros-lib-setting-description]
exteros-qol-even-distribution-ticks=How long (in ticks) the mod waits after the last click before distributing items. (60 = 1 second)
exteros-qol-even-distribution-swap-balance=If enabled, Ctrl+M1 will be Balanced mode and Ctrl+M2 will be Even mode.
exteros-qol-even-distribution-fuel-limit=Caps how much fuel a drag adds to each fuel inventory, counting all fuel already inside it. 0 = no limit.
exteros-qol-even-distribution-fuel-limit-unit=Unit for the fuel limit above: stacks, items, or MJ (1 MJ = 1,000,000 J) across the whole inventory.
exteros-qol-even-distribution-ammo-limit=Caps how much ammo a drag adds to each ammo inventory, counting every ammo item already loaded. 0 = no limit.
exteros-qol-even-distribution-ammo-limit-unit=Unit for the ammo limit above: stacks or items of the dragged ammo.
exteros-qol-even-distribution-source=Where a drag takes items from: your whole inventory (cursor and main inventory), or only the stack in your hand.
exteros-qol-auto-deconstruct-chests=Also removes the output container of a removed mining drill, if nothing else is feeding it.
exteros-qol-auto-deconstruct-inserters=Also removes inserters that were only feeding fuel into the removed mining drill.
exteros-qol-auto-deconstruct-beacons=Removes beacons that no longer affect any remaining entity.
exteros-qol-auto-deconstruct-pipes=Places pipe ghosts to bridge fluid connections through a removed fluid-input drill, keeping fluid flowing downstream.
exteros-qol-auto-deconstruct-belts=Removes output belts that no longer carry anything from a live source, up to the distance below.
exteros-qol-auto-deconstruct-belt-distance=How far (in tiles) from a removed mining drill the mod looks for dead belts to remove.
exteros-qol-auto-deconstruct-poles=Removes electric poles that end up powering nothing, without ever splitting the remaining network, up to the distance below.
exteros-qol-auto-deconstruct-pole-distance=How far (in tiles) from a removed mining drill the mod looks for unused electric poles to remove.
exteros-qol-auto-deconstruct-pumpjacks=Removes extractors on infinite resources (such as oil) once every resource in range is at minimum yield. Only useful with mods that make oil finite; costs performance, so leave off otherwise.
exteros-qol-inventory-repair-interval=How often (in ticks) the mod checks your inventory and performs a "tick" of repair.
exteros-qol-inventory-repair-order=Choose whether to use the weakest or strongest repair packs first.
exteros-qol-auto-alt-mode-player=Lets you opt out of Auto Alt Mode even while the server has it on. Default: on.
exteros-qol-force-insert-always=Off: forces a transfer only once nothing more fits, or on a second click within the action window. On: every transfer ignores the slot limit.
exteros-qol-force-insert-window=How long a click or a drag counts as one continuous action. (60 = 1 second)
exteros-qol-wire-shortcuts-cycle-copper=Cycles through red, green and copper wire. When off, cycles between red and green only.
exteros-qol-copy-chest-between-surfaces=Allows moving contents between containers on different surfaces. When off, both containers and the player must be on the same surface.
exteros-qol-player-colors-character-color=Color of your character. Pick "custom" to use the hex code below, or "default" to leave your color untouched.
exteros-qol-player-colors-character-color-hex=Your own color as a hex code, for example #E08A2E. Only used when the setting above is set to "custom".
exteros-qol-player-colors-chat-color=Color of your name in chat. Pick "custom" to use the hex code below, or "default" to leave it untouched.
exteros-qol-player-colors-chat-color-hex=Your own chat color as a hex code, for example #4A7FD9. Only used when the setting above is set to "custom".
exteros-qol-chest-limit-player=Lets you opt out of Chest Limit even while the server has it on. Default: on.
exteros-qol-rate-calculator-dismiss-tool-on-selection=Dismisses the Rate Calculator tool from your cursor after you select an area.
exteros-qol-rate-calculator-show-calculation-errors=Shows calculation problems in the GUI.
exteros-qol-rate-calculator-show-power-consumption=Shows power consumption rate in the GUI. Off by default.
exteros-qol-rate-calculator-default-gui-location=Middle-click the titlebar to reset the GUI to its default location.
exteros-qol-rate-calculator-default-timescale=Default unit for new Rate Calculator windows; each window's timescale can be changed later from its subheader dropdown.
exteros-qol-rate-calculator-show-completion-checkboxes=Adds a checkbox to each row to mark items done.
exteros-qol-rate-calculator-show-intermediate-breakdowns=Shows a column with the input and output rate of each intermediate product.
exteros-qol-rate-calculator-show-pollution=Display the pollution rate in the GUI.
exteros-qol-ghost-builder-entities=Builds building ghosts you hover over when you carry the item they need.
exteros-qol-ghost-builder-upgrades=Applies upgrade planner requests when you hover with the target item, and returns the replaced item.
exteros-qol-ghost-builder-tiles=Builds tile ghosts you hover over when you carry the item, and returns whatever the replaced tile drops.
exteros-qol-ghost-builder-modules=Fills empty module slots from your inventory, matching the building's requests — after Ghost Builder or normal building, and when hovering over a machine still missing modules.
exteros-qol-planner-menu-columns=How many slot buttons the Planner Menu window shows per row.
exteros-qol-belt-visualizer-max-per-tick=How many entities the highlight scan checks per tick. Lower it if large belt networks stutter.
exteros-qol-belt-visualizer-max-entities=Highlight stops growing once a belt line reaches this many entities, to avoid freezing on huge networks.
exteros-qol-searchlight-player-enabled=Character automatically faces the selected building.
exteros-qol-item-count-player-enabled=Shows count of held item in inventory (and vehicle trunk) in the center of the screen.
exteros-qol-item-count-format=How counts are shown: 1,234 / 1.234 / 1 234 / 1234 / 1.2k. Default: 1,234.
exteros-qol-inventory-sort-player-enabled=Automatically sort container inventories when opened. SHIFT+I always manually sorts regardless of this setting.
exteros-qol-auto-alt-mode-enabled=Automatically enables Alt mode (building info overlays) when joining a game.
exteros-qol-auto-deconstruct-enabled=Automatically marks mining drills for deconstruction when they run out of resources.
exteros-qol-belt-brush-enabled=Hold a belt, underground belt, pipe-to-ground, loader, wall, heat pipe, or inserter to open a window and paint several lanes side by side. Default hotkeys: CONTROL + SHIFT + B cycles shape, CONTROL + SHIFT + N cycles balancers, CONTROL + mouse wheel (or keypad + / −) changes width.
exteros-qol-belt-reverser-enabled=Adds a hotkey that reverses the direction of an entire transport line, including underground belts and loaders. Default CONTROL + R.
exteros-qol-belt-visualizer-enabled=Press CONTROL + G over a belt, underground belt, splitter, loader, or linked belt to highlight everything feeding into it and everything it feeds; press again to cycle both lanes, left only, right only, off. The toolbar toggle makes the highlight follow your cursor.
exteros-qol-chest-limit-enabled=While holding a container, a window lets you set how many slots stay blocked; every container of that kind you build afterwards starts the same way.
exteros-qol-copy-chest-enabled=Adds hotkeys that move the entire contents of one container into another. Default SHIFT + C and SHIFT + V.
exteros-qol-even-distribution-enabled=Enables even distribution of items when using Ctrl + Mouse.
exteros-qol-force-insert-enabled=Lets fast transfer put items past a container's slot limit. Works with SHIFT+click, CTRL+click, and while dragging across buildings.
exteros-qol-ghost-builder-enabled=Hover over a ghost (or a building marked for upgrade) while carrying the right item to build or upgrade it instantly. Default toggle CONTROL + SHIFT + G.
exteros-qol-inventory-repair-enabled=Automatically repairs damaged placeable items in your inventory using repair packs.
exteros-qol-inventory-sort-enabled=Turns the whole Auto Inventory Sort feature on, including the SHIFT + I hotkey.
exteros-qol-item-count-enabled=Turns the whole Held Item Count feature on.
exteros-qol-planner-menu-enabled=Opens a window with every planner and selection tool, vanilla and modded; click one to take it, or cycle with a hotkey. Default toggle CONTROL + B, cycle ALT + Q / ALT + SHIFT + Q.
exteros-qol-planner-zapper-enabled=Dropping a blueprint, blueprint book, deconstruction planner, upgrade planner or selection tool destroys it instead of leaving it on the ground.
exteros-qol-player-colors-enabled=Sets your character and chat color when your character is first created, and whenever you change these settings.
exteros-qol-quality-scroll-enabled=Adds hotkeys that swap the item in your cursor for the same item of another quality, if you have one in your inventory. Default CONTROL + SHIFT + mouse wheel.
exteros-qol-rate-calculator-enabled=Select machines with the Rate Calculator tool (ALT + X or the toolbar shortcut) to see their combined production and consumption rates. Based on Rate Calculator by raiguard.
exteros-qol-renamer-enabled=Opens a window to rename the building under your cursor — anything with a name, like a train stop or roboport. Default CONTROL + SHIFT + R.
exteros-qol-searchlight-enabled=Turns on auto-facing: your character turns toward the building you select. The flashlight settings below apply either way; each player enables this for themselves in Exteros' Hub.
exteros-qol-tape-measure-enabled=Adds a selection tool (also in the Planner Menu) showing width, height and tile count of a dragged rectangle; SHIFT + drag keeps it drawn until the next one. Default CONTROL + SHIFT + M.
exteros-qol-time-controls-enabled=Adds buttons to the top left to control game speed. Only admins can change the game speed.
exteros-qol-wire-shortcuts-enabled=Adds a hotkey that puts a wire in your cursor and cycles between wire types. Default ALT + W.

