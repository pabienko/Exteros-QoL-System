[mod-name]
Exteros-QoL-System=Exteros Quality of Life System

[mod-description]
Exteros-QoL-System=Modular QoL bundle for Factorio 2.0 and 2.1, every feature switches on separately: Rate Calculator, Even Distribution, Force Insert, Belt Brush, Belt Reverser, Squeak Through, Auto Deconstruct, Inventory Repair, Copy Chest, Chest Limit, Time Controls, Auto Inventory Sort, Held Item Count, Player Searchlight, Wire Shortcuts, Planner Zapper, Quality Scroll, Renamer, Player Colors, Auto Alt Mode, Ghost Builder, Planner Menu and Tape Measure, all set up in one Settings Hub.

