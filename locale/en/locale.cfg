[mod-setting-description]
exteros-qol-debug-enabled=Shows detailed technical logs in the console.
exteros-qol-squeak-through-enabled=Lets you squeeze between buildings, pipes and trees by shrinking collision boxes slightly.
exteros-qol-searchlight-flashlight-global-scale=Multiplier for every player's flashlight beam and glow. Default 1 = vanilla; startup setting, so changing it reloads the save.
exteros-qol-searchlight-flashlight-global-intensity=Brightness multiplier for every player's flashlight. 1 = vanilla, up to 1.6667 (the engine's cap); startup setting, so changing it reloads the save.
exteros-qol-searchlight-flashlight-global-color=Flashlight color for every player, as a hex code like #FFCC88. Leave blank for vanilla; startup setting, so changing it reloads the save.
exteros-qol-bottleneck-enabled=Shows a colored status light on assembling machines, furnaces and rocket silos: working, stopped, low power, or output jammed. Prototype graphics only, no performance cost.
exteros-qol-bottleneck-mining-drills=Also draws the status light on mining drills.
exteros-qol-bottleneck-size=How big the status light is drawn.
exteros-qol-bottleneck-glow=Adds a soft glow so the light is visible at night.
exteros-qol-bottleneck-override=Overwrites status colors set by another mod instead of leaving them.
exteros-qol-bottleneck-color-working=Color for a working machine, as a hex code like #00FF00.
exteros-qol-bottleneck-color-full-output=Color for a machine whose output is full, as a hex code like #FFFF00.
exteros-qol-bottleneck-color-stopped=Color for a stopped machine (no ingredients, no resources, or disabled), as a hex code like #FF0000.
exteros-qol-bottleneck-color-low-power=Color for a machine low on or without power, as a hex code like #FF8000.

