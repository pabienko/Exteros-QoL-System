exteros-qol-open-hub=Settings Hub: открыть
exteros-qol-manual-inventory-sort=Auto Inventory Sort: сортировать открытый контейнер
exteros-qol-wire-cycle=Wire Shortcuts: переключить провод
exteros-qol-quality-cycle-next=Quality Scroll: следующее качество
exteros-qol-quality-cycle-previous=Quality Scroll: предыдущее качество
exteros-qol-copy-chest=Copy Chest: вырезать содержимое
exteros-qol-paste-chest=Copy Chest: вставить содержимое
exteros-qol-reverse-belts=Belt Reverser: развернуть конвейеры
exteros-qol-rename-entity=Renamer: переименовать объект
exteros-qol-belt-brush-corners=Belt Brush: сменить форму
exteros-qol-belt-brush-balancers=Belt Brush: сменить балансировщик/каскад
exteros-qol-belt-brush-increase=Belt Brush: добавить полосу
exteros-qol-belt-brush-decrease=Belt Brush: убрать полосу
exteros-qol-belt-brush-clear=Belt Brush: очистить курсор
