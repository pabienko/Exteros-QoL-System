[mod-name]
Exteros-QoL-System=Система качества жизни Exteros

[mod-description]
Exteros-QoL-System=Модульный набор улучшений качества жизни: равномерное распределение предметов, проскальзывание между постройками, автоматический снос и многое другое. Всё, что нужно, в одном месте.

