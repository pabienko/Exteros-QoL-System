consumption=Потребление
error-incompatible-science-packs=Некоторые лаборатории имеют несовместимые исследовательские пакеты
error-inserter-rates-estimates-description=Скорости манипуляторов рассчитываются исходя из предположения о том, что манипулятор перемещает непосредственно из одного контейнера в другой, и что он использует позиции подбора и выкладывания по умолчанию. Если манипулятор взаимодействует с транспортным конвейером или если местоположения подбора/выкладывания были изменены, фактическая скорость будет отличаться от той, что отображается.
