[mod-name]
Exteros-QoL-System=Система качества жизни Exteros

[mod-description]
Exteros-QoL-System=Модульный набор улучшений для Factorio 2.0 и 2.1, каждая функция включается отдельно: Rate Calculator (калькулятор скорости), Even Distribution, Force Insert, Belt Brush, Belt Reverser, Squeak Through, Auto Deconstruct, Inventory Repair, Copy Chest, Chest Limit, Time Controls, Auto Inventory Sort, Held Item Count, Player Searchlight, Wire Shortcuts, Planner Zapper, Quality Scroll, Renamer, Player Colors и Auto Alt Mode — всё настраивается в одном Settings Hub.

