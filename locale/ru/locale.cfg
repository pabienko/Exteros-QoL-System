[mod-setting-description]
exteros-qol-even-distribution-enabled=Включает равномерное распределение предметов при использовании Ctrl+щелчок+протягивание.
exteros-qol-debug=Показывает подробную техническую информацию в консоли.
exteros-qol-squeak-through-enabled=Позволяет игроку проходить между зданиями, трубами и деревьями за счёт небольшого уменьшения областей столкновения.
exteros-qol-auto-deconstruct-enabled=Автоматически помечает буры для сноса, когда под ними заканчиваются ресурсы.
exteros-qol-inventory-repair-enabled=Автоматически ремонтирует повреждённые размещаемые предметы в инвентаре с помощью ремонтных комплектов.
exteros-qol-time-controls-enabled=Добавляет кнопки в левом верхнем углу для управления скоростью игры. Изменять скорость игры могут только администраторы.
exteros-qol-auto-alt-enabled=Автоматически включает режим дополнительной информации (отображение информации об объектах) при входе в игру.
exteros-qol-auto-sort-inventory=Автоматически сортирует содержимое контейнеров при открытии. SHIFT+I в любом случае сортирует вручную, независимо от этой настройки.
exteros-qol-item-count-enabled=Показывает количество удерживаемого предмета в инвентаре (и багажнике транспорта) в центре экрана.
exteros-qol-searchlight-enabled=Персонаж автоматически поворачивается лицом к выбранному объекту.
exteros-qol-force-insert-enabled=Позволяет быстрому переносу помещать предметы сверх лимита инвентаря (красной полосы) контейнера. Работает с SHIFT+щелчок и CTRL+щелчок, а также при перетаскивании по объектам в мире.
exteros-qol-force-insert-always=Когда выключено, перенос выполняется принудительно, только когда больше ничего не помещается; повторный щелчок в пределах окна действия принудительно выполняет перенос, даже если место ещё есть. Когда включено, каждый перенос игнорирует лимит.
exteros-qol-force-insert-window=Как долго щелчок или перетаскивание считаются одним непрерывным действием. (60 = 1 секунда)
exteros-qol-wire-shortcuts-enabled=Добавляет горячую клавишу, которая берёт провод в курсор и переключает его между типами проводов. По умолчанию ALT + W, переназначается в Настройки > Управление > Моды.
exteros-qol-wire-cycle-copper=Переключает между красным, зелёным и медным проводом. Когда выключено — только между красным и зелёным.
exteros-qol-planner-zapper-enabled=Выбрасывание чертежа, книги чертежей, плана сноса, плана улучшения или инструмента выделения уничтожает его вместо того, чтобы оставить на земле.
exteros-qol-quality-scroll-enabled=Добавляет горячие клавиши, которые заменяют предмет в курсоре тем же предметом другого качества, если такой есть в инвентаре. По умолчанию CONTROL + SHIFT + колесо мыши.
even-distribution-ticks=Как долго (в тиках) мод ждёт после последнего щелчка, прежде чем распределить предметы. (60 = 1 секунда)
even-distribution-swap-balance=Если включено, Ctrl+ЛКМ будет работать в сбалансированном режиме, а Ctrl+ПКМ — в режиме равномерного распределения.
exteros-qol-inventory-repair-interval=Как часто (в тиках) мод проверяет инвентарь и выполняет «такт» ремонта.
exteros-qol-inventory-repair-order=Выберите, использовать сначала самые слабые или самые сильные ремонтные комплекты.
exteros-qol-copy-chest-enabled=Добавляет горячие клавиши, которые переносят всё содержимое одного контейнера в другой. По умолчанию SHIFT + C и SHIFT + V, переназначаются в Настройки > Управление > Моды.
exteros-qol-copy-chest-between-surfaces=Позволяет переносить содержимое между контейнерами на разных поверхностях. Когда выключено, оба контейнера и игрок должны находиться на одной поверхности.
exteros-qol-belt-reverser-enabled=Добавляет горячую клавишу, которая разворачивает всю транспортную линию, включая подземные конвейеры и погрузчики. По умолчанию CONTROL + R, переназначается в Настройки > Управление > Моды. Автоматически отключается при наличии отдельного мода разворота конвейеров.
exteros-qol-player-colors-enabled=Задаёт цвет персонажа и чата при создании персонажа, а также при каждом изменении этих настроек.
exteros-qol-character-color=Цвет вашего персонажа. Выберите «Свой hex», чтобы использовать код ниже, или «По умолчанию», чтобы оставить цвет без изменений.
exteros-qol-character-color-hex=Собственный цвет в виде hex-кода, например #E08A2E. Используется, только если настройка выше имеет значение «Свой hex».
exteros-qol-chat-color=Цвет вашего имени в чате. Выберите «Свой hex», чтобы использовать код ниже, или «По умолчанию», чтобы оставить цвет без изменений.
exteros-qol-chat-color-hex=Цвет вашего имени в чате в виде hex-кода, например #4A7FD9. Используется, только если настройка выше имеет значение «Свой hex».
exteros-qol-renamer-enabled=Добавляет горячую клавишу, открывающую небольшое окно для переименования объекта под курсором — для всего, что имеет имя, например железнодорожной станции или робопорта. По умолчанию CONTROL + SHIFT + R, переназначается в Настройки > Управление > Моды. Автоматически отключается при наличии мода Renamer.
exteros-qol-chest-limit-enabled=Пока вы держите контейнер, небольшое окно позволяет задать, сколько его слотов останется заблокированным. Каждый построенный позже контейнер этого типа будет создан с таким количеством заблокированных слотов.
exteros-qol-belt-brush-enabled=Пока вы держите конвейер, подземный конвейер, подземную трубу, погрузчик, стену, тепловую трубу или манипулятор, небольшое окно позволяет выбрать количество полос, заменяя курсор временным чертежом, который рисует столько полос рядом. По умолчанию CONTROL + SHIFT + B переключает между прямыми, угловыми и подземными формами, а CONTROL + SHIFT + N перебирает балансировщики и каскад; обе клавиши переназначаются в Настройки > Управление > Моды. Автоматически отключается при наличии мода Belt Brush. Ширина кисти меняется с ALT + колесо мыши или клавишами + и − на цифровой клавиатуре.
exteros-qol-rate-calculator-enabled=Выделяйте машины инструментом Rate Calculator (ALT + X или кнопка на панели), чтобы увидеть их суммарную скорость производства и потребления. На основе мода Rate Calculator от raiguard.
exteros-qol-rcalc-dismiss-tool-on-selection=Измеритель Rate Calculator автоматически пропадает из курсора после выбора области.
exteros-qol-rcalc-show-calculation-errors=Если при выполнении вычислений обнаружены проблемы, они будут отображены в интерфейсе.
exteros-qol-rcalc-show-power-consumption=Показывать уровень энергопотребления в графическом интерфейсе. Отключено по умолчанию, потому что это не очень полезно.
exteros-qol-rcalc-default-gui-location=Вы можете сбросить графический интерфейс к его местоположению по умолчанию в любое время, щёлкнув СКМ по заголовку.
exteros-qol-rcalc-default-timescale=Единица измерения скорости при открытии нового окна Rate Calculator. Шкалу времени каждого окна можно потом менять в его заголовке.
exteros-qol-rcalc-show-completion-checkboxes=Добавляет флажок возле каждой строки, чтобы отмечать обработанные позиции.
exteros-qol-rcalc-show-intermediate-breakdowns=Показывает колонку со скоростью ввода и вывода каждого промежуточного продукта.
exteros-qol-rcalc-show-pollution=Показывать уровень загрязнения в интерфейсе.

