[exteros-lib-setting-description]
exteros-qol-even-distribution-ticks=Doba (v ticích), po kterou mod čeká od posledního kliknutí, než rozdělí předměty. (60 = 1 sekunda)
exteros-qol-even-distribution-swap-balance=Pokud je povoleno, Ctrl+M1 bude režim Balancování a Ctrl+M2 bude režim Rovnoměrný.
exteros-qol-even-distribution-fuel-limit=Omezuje, kolik paliva tažení přidá do každého palivového inventáře, počítá se i palivo, které už v něm je. 0 = bez limitu.
exteros-qol-even-distribution-fuel-limit-unit=Jednotka limitu paliva výše: stacky, kusy, nebo MJ (1 MJ = 1 000 000 J) v celém inventáři.
exteros-qol-even-distribution-ammo-limit=Omezuje, kolik munice tažení přidá do každého inventáře munice, počítá se i munice, která už v něm je. 0 = bez limitu.
exteros-qol-even-distribution-ammo-limit-unit=Jednotka limitu munice výše: kusy nebo stacky tažené munice.
exteros-qol-even-distribution-source=Odkud tažení bere předměty: z celého inventáře (kurzor i hlavní inventář), nebo jen ze stacku v ruce.
exteros-qol-auto-deconstruct-chests=Odstraní i výstupní bednu zrušeného těžaře, pokud do ní nic jiného neskládá.
exteros-qol-auto-deconstruct-inserters=Odstraní i inserttery, které do zrušeného těžaře jen dodávaly palivo.
exteros-qol-auto-deconstruct-beacons=Odstraní majáky, které už neovlivňují žádnou zbývající budovu.
exteros-qol-auto-deconstruct-pipes=Při zrušení těžaře s kapalinovým vstupem položí duchy trubek, aby kapalina dál proudila k dalším těžařům v řetězci.
exteros-qol-auto-deconstruct-belts=Odstraní výstupní pásy, které už nic nevezou od žádného živého zdroje, až do níže uvedené vzdálenosti.
exteros-qol-auto-deconstruct-belt-distance=Jak daleko (v dlaždicích) od zrušeného těžaře mod hledá mrtvé pásy k odstranění.
exteros-qol-auto-deconstruct-poles=Odstraní elektrické sloupy, které už nic nenapájejí, aniž by rozdělil zbývající síť, až do níže uvedené vzdálenosti.
exteros-qol-auto-deconstruct-pole-distance=Jak daleko (v dlaždicích) od zrušeného těžaře mod hledá nevyužité elektrické sloupy k odstranění.
exteros-qol-auto-deconstruct-pumpjacks=Odstraní těžaře na nekonečných zdrojích (např. ropě), jakmile je každý zdroj v dosahu na minimálním výnosu. Užitečné jen s mody, které dělají ropu konečnou; stojí to výkon, jinak to nech vypnuté.
exteros-qol-inventory-repair-interval=Jak často (v ticích) mod kontroluje inventář a provede jeden krok opravy.
exteros-qol-inventory-repair-order=Zvol, zda se mají nejdříve použít nejslabší nebo nejsilnější opravné sady.
exteros-qol-auto-alt-mode-player=Dovolí ti vypnout Auto Alt Mode pro sebe, i když ho server má zapnutý. Výchozí: zapnuto.
exteros-qol-force-insert-always=Vypnuto: přesun se vynutí až když se nic nevejde, nebo druhým kliknutím do konce okna akce. Zapnuto: každý přesun limit slotů ignoruje.
exteros-qol-force-insert-window=Jak dlouho se kliknutí nebo tažení počítá jako jedna souvislá akce. (60 = 1 sekunda)
exteros-qol-wire-shortcuts-cycle-copper=Přepíná mezi červeným, zeleným a měděným kabelem. Když je vypnuto, střídá jen červený a zelený.
exteros-qol-copy-chest-between-surfaces=Dovolí přesouvat obsah mezi truhlami na různých povrchech. Když je vypnuto, obě truhly i hráč musí být na stejném povrchu.
exteros-qol-player-colors-character-color=Barva tvojí postavy. Vyber „custom“ pro vlastní hex kód níže, nebo „default“ pro ponechání současné barvy.
exteros-qol-player-colors-character-color-hex=Vlastní barva jako hex kód, například #E08A2E. Použije se jen tehdy, když je nastavení výše na „custom“.
exteros-qol-player-colors-chat-color=Barva tvého jména v chatu. Vyber „custom“ pro vlastní hex kód níže, nebo „default“ pro ponechání současné barvy.
exteros-qol-player-colors-chat-color-hex=Vlastní barva chatu jako hex kód, například #4A7FD9. Použije se jen tehdy, když je nastavení výše na „custom“.
exteros-qol-chest-limit-player=Dovolí ti vypnout Chest Limit pro sebe, i když ho server má zapnutý. Výchozí: zapnuto.
exteros-qol-rate-calculator-dismiss-tool-on-selection=Po označení oblasti se nástroj Rate Calculator sám odloží z kurzoru.
exteros-qol-rate-calculator-show-calculation-errors=Zobrazí v okně problémy s výpočtem.
exteros-qol-rate-calculator-show-power-consumption=Zobrazí v okně spotřebu elektřiny. Ve výchozím stavu vypnuto.
exteros-qol-rate-calculator-default-gui-location=Prostřední tlačítko na záhlaví vrátí okno na výchozí místo.
exteros-qol-rate-calculator-default-timescale=Výchozí jednotka pro nově otevřená okna; v každém okně ji pak jde změnit zvlášť.
exteros-qol-rate-calculator-show-completion-checkboxes=Přidá ke každému řádku zaškrtávátko pro hotové položky.
exteros-qol-rate-calculator-show-intermediate-breakdowns=Zobrazí sloupec s výrobou a spotřebou každého meziproduktu.
exteros-qol-rate-calculator-show-pollution=Zobrazí v okně množství znečištění.
exteros-qol-ghost-builder-entities=Postaví ducha budovy, na kterou najedeš kurzorem, pokud u sebe máš potřebný předmět.
exteros-qol-ghost-builder-upgrades=Provede požadavek plánovače vylepšení, když najedeš kurzorem s cílovým předmětem, a vrátí ti nahrazený předmět.
exteros-qol-ghost-builder-tiles=Postaví ducha dlaždice, na kterou najedeš kurzorem s potřebným předmětem, a vrátí ti, co by vypadlo z nahrazené dlaždice.
exteros-qol-ghost-builder-modules=Doplní prázdné sloty na moduly z tvého inventáře podle požadavků budovy — po postavení Ghost Builderem nebo normálně, i když najedeš na stroj, který na moduly stále čeká.
exteros-qol-planner-menu-columns=Kolik tlačítek na řádek okno Planner Menu zobrazí.
exteros-qol-belt-visualizer-max-per-tick=Kolik entit kontrola zvýraznění projde za jeden tick. Sniž, pokud se obrovské sítě pásů zasekávají.
exteros-qol-belt-visualizer-max-entities=Zvýraznění se přestane rozrůstat, jakmile linka pásů dosáhne tohoto počtu entit, aby hra nezamrzla u obrovských sítí.
exteros-qol-searchlight-player-enabled=Postava se automaticky otočí směrem k vybrané budově.
exteros-qol-item-count-player-enabled=Zobrazí počet drženého předmětu v inventáři (a kufru vozidla) uprostřed obrazovky.
exteros-qol-item-count-format=Jak se čísla zobrazují: 1,234 / 1.234 / 1 234 / 1234 / 1.2k. Výchozí: 1,234.
exteros-qol-inventory-sort-player-enabled=Automaticky třídit kontejnery při otevření. SHIFT+I vždy ručně utřídí bez ohledu na toto nastavení.
exteros-qol-auto-alt-mode-enabled=Automaticky zapne Alt režim (ikony na budovách) při připojení do hry.
exteros-qol-auto-deconstruct-enabled=Automaticky označí těžaře (minery) k dekonstrukci, jakmile vytěží veškerou rudu.
exteros-qol-belt-brush-enabled=Když držíš pás, podzemní pás, potrubí do země, nakladač, zeď, tepelné potrubí nebo podavač, otevře se okénko pro počet pruhů a štětec jich vykreslí vedle sebe. Výchozí klávesy: CONTROL + SHIFT + B přepíná tvar, CONTROL + SHIFT + N přepíná balancery, CONTROL + kolečko myši (nebo + / − na numerické klávesnici) mění šířku.
exteros-qol-belt-reverser-enabled=Přidá klávesu, která otočí směr celé dopravní linky včetně podzemních pásů a nakladačů. Výchozí CONTROL + R.
exteros-qol-belt-visualizer-enabled=CONTROL + G nad pásem, podzemním pásem, rozdělovačem, nakladačem nebo propojeným pásem zvýrazní, odkud do něj předměty přicházejí a kam z něj odcházejí; opakovaný stisk přepíná mezi oběma stranami, jen levou, jen pravou a vypnutím. Přepínač na liště nástrojů nechá zvýraznění sledovat pás pod kurzorem.
exteros-qol-chest-limit-enabled=Když držíš truhlu, okénko ti dovolí nastavit, kolik jejích slotů zůstane zablokovaných; každá další truhla toho druhu to převezme.
exteros-qol-copy-chest-enabled=Přidá klávesy, které přesunou celý obsah jedné truhly do druhé. Výchozí SHIFT + C a SHIFT + V.
exteros-qol-even-distribution-enabled=Povolí rovnoměrné rozdělování předmětů při použití Ctrl + Klik.
exteros-qol-force-insert-enabled=Umožní rychlému přesunu vložit předměty i přes limit zablokovaných slotů kontejneru. Funguje s SHIFT+klik i CTRL+klik, i při tažení přes budovy ve světě.
exteros-qol-ghost-builder-enabled=Najeď kurzorem na ducha (nebo budovu označenou k vylepšení) se správným předmětem u sebe a postaví nebo vylepší se okamžitě. Výchozí klávesa pro zapnutí/vypnutí CONTROL + SHIFT + G.
exteros-qol-inventory-repair-enabled=Automaticky opravuje poškozené umístitelné předměty ve tvém inventáři pomocí opravných sad.
exteros-qol-inventory-sort-enabled=Zapne celý Auto Inventory Sort, včetně klávesy SHIFT + I.
exteros-qol-item-count-enabled=Zapne celý Held Item Count.
exteros-qol-planner-menu-enabled=Otevře okno se všemi plánovači a výběrovými nástroji, vanilla i moddovanými; kliknutím si jeden vezmeš, nebo mezi nimi cykluj klávesou. Výchozí zapínací klávesa CONTROL + B, cyklení ALT + Q / ALT + SHIFT + Q.
exteros-qol-planner-zapper-enabled=Upuštěný plán, kniha plánů, plánovač demolice, plánovač vylepšení nebo výběrový nástroj se zničí místo toho, aby zůstal ležet na zemi.
exteros-qol-player-colors-enabled=Nastaví barvu tvojí postavy a chatu při prvním vytvoření postavy a pak vždy, když tahle nastavení změníš.
exteros-qol-quality-scroll-enabled=Přidá klávesy, které vymění předmět v ruce za tentýž předmět jiné kvality, pokud ho máš v inventáři. Výchozí CONTROL + SHIFT + kolečko myši.
exteros-qol-rate-calculator-enabled=Označ stroje nástrojem Rate Calculator (ALT + X nebo tlačítko v liště zkratek) a uvidíš jejich celkovou výrobu a spotřebu. Podle módu Rate Calculator od raiguarda.
exteros-qol-renamer-enabled=Otevře okénko pro přejmenování budovy pod kurzorem — čehokoliv se jménem, jako vlaková zastávka nebo roboport. Výchozí CONTROL + SHIFT + R.
exteros-qol-searchlight-enabled=Zapne automatické otáčení: postava se natočí k budově, kterou vybereš. Celoserverová nastavení svítilny níže platí tak jako tak; tohle si každý hráč zapíná sám v Exteros' Hubu.
exteros-qol-tape-measure-enabled=Přidá výběrový nástroj (i z Planner Menu), který po tažení obdélníku ukáže jeho šířku, výšku a počet dlaždic; SHIFT + tažení ponechá měření vykreslené do dalšího. Výchozí klávesa CONTROL + SHIFT + M.
exteros-qol-time-controls-enabled=Přidá tlačítka do horního levého rohu pro ovládání rychlosti hry. Rychlost hry mohou měnit jen admini.
exteros-qol-wire-shortcuts-enabled=Přidá klávesu, která vezme kabel do ruky a přepíná mezi jeho druhy. Výchozí ALT + W.

