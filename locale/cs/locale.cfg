[mod-setting-description]
exteros-qol-even-distribution-enabled=Povolí rovnoměrné rozdělování předmětů při použití Ctrl + Klik.
exteros-qol-debug=Zobrazuje detailní technické logy v konzoli.
exteros-qol-squeak-through-enabled=Umožňuje hráči procházet mezi budovami, potrubím a stromy díky mírnému zmenšení kolizních boxů.
exteros-qol-auto-deconstruct-enabled=Automaticky označí těžaře (minery) k dekonstrukci, jakmile vytěží veškerou rudu.
exteros-qol-inventory-repair-enabled=Automaticky opravuje poškozené umístitelné předměty ve tvém inventáři pomocí opravných sad.
exteros-qol-time-controls-enabled=Přidá tlačítka do horního levého rohu pro ovládání rychlosti hry. Rychlost hry mohou měnit jen admini.
exteros-qol-auto-alt-enabled=Automaticky zapne Alt režim (ikony na budovách) při připojení do hry.
exteros-qol-auto-sort-inventory=Automaticky třídit kontejnery při otevření. SHIFT+I vždy ručně utřídí bez ohledu na toto nastavení.
exteros-qol-item-count-enabled=Zobrazí počet drženého předmětu v inventáři (a kufru vozidla) uprostřed obrazovky.
exteros-qol-item-count-format=Jak se čísla zobrazují: 1,234 / 1.234 / 1 234 / 1234 / 1.2k. Výchozí: 1,234.
exteros-qol-auto-alt-player=Dovolí ti vypnout Auto Alt Mode pro sebe, i když ho server má zapnutý. Výchozí: zapnuto.
exteros-qol-chest-limit-player=Dovolí ti vypnout Chest Limit pro sebe, i když ho server má zapnutý. Výchozí: zapnuto.
exteros-qol-searchlight-enabled=Postava se automaticky otočí směrem k vybrané budově.
exteros-qol-force-insert-enabled=Umožní rychlému přesunu vložit předměty i přes limit zablokovaných slotů kontejneru. Funguje s SHIFT+klik i CTRL+klik, i při tažení přes budovy ve světě.
exteros-qol-force-insert-always=Když je vypnuto, přesun se vynutí až ve chvíli, kdy se už nic nevejde; druhé kliknutí do konce okna akce ho vynutí i tehdy, když místo ještě je. Když je zapnuto, každý přesun limit ignoruje.
exteros-qol-force-insert-window=Jak dlouho se kliknutí nebo tažení počítá jako jedna souvislá akce. (60 = 1 sekunda)
exteros-qol-wire-shortcuts-enabled=Přidá klávesu, která vezme kabel do ruky a přepíná mezi jeho druhy. Výchozí ALT + W.
exteros-qol-wire-cycle-copper=Přepíná mezi červeným, zeleným a měděným kabelem. Když je vypnuto, střídá jen červený a zelený.
exteros-qol-planner-zapper-enabled=Upuštěný plán, kniha plánů, plánovač demolice, plánovač vylepšení nebo výběrový nástroj se zničí místo toho, aby zůstal ležet na zemi.
exteros-qol-quality-scroll-enabled=Přidá klávesy, které vymění předmět v ruce za tentýž předmět jiné kvality, pokud ho máš v inventáři. Výchozí CONTROL + SHIFT + kolečko myši.
even-distribution-ticks=Doba (v ticích), po kterou mod čeká od posledního kliknutí, než rozdělí předměty. (60 = 1 sekunda)
even-distribution-swap-balance=Pokud je povoleno, Ctrl+M1 bude režim Balancování a Ctrl+M2 bude režim Rovnoměrný.
exteros-qol-inventory-repair-interval=Jak často (v ticích) mod kontroluje inventář a provede jeden krok opravy.
exteros-qol-inventory-repair-order=Zvol, zda se mají nejdříve použít nejslabší nebo nejsilnější opravné sady.
exteros-qol-copy-chest-enabled=Přidá klávesy, které přesunou celý obsah jedné truhly do druhé. Výchozí SHIFT + C a SHIFT + V.
exteros-qol-copy-chest-between-surfaces=Dovolí přesouvat obsah mezi truhlami na různých povrchech. Když je vypnuto, obě truhly i hráč musí být na stejném povrchu.
exteros-qol-belt-reverser-enabled=Přidá klávesu, která otočí směr celé dopravní linky včetně podzemních pásů a nakladačů. Výchozí CONTROL + R.
exteros-qol-player-colors-enabled=Nastaví barvu tvojí postavy a chatu při prvním vytvoření postavy a pak vždy, když tahle nastavení změníš.
exteros-qol-character-color=Barva tvojí postavy. Vyber „custom" pro vlastní hex kód níže, nebo „default" pro ponechání současné barvy.
exteros-qol-character-color-hex=Vlastní barva jako hex kód, například #E08A2E. Použije se jen tehdy, když je nastavení výše na „custom".
exteros-qol-chat-color=Barva tvého jména v chatu. Vyber „custom" pro vlastní hex kód níže, nebo „default" pro ponechání současné barvy.
exteros-qol-chat-color-hex=Vlastní barva chatu jako hex kód, například #4A7FD9. Použije se jen tehdy, když je nastavení výše na „custom".
exteros-qol-renamer-enabled=Přidá klávesu, která otevře okénko pro přejmenování budovy pod kurzorem, tedy všeho, co nese jméno, jako je vlaková zastávka nebo roboport. Výchozí CONTROL + SHIFT + R.
exteros-qol-chest-limit-enabled=Když držíš v ruce truhlu, malé okénko ti dovolí nastavit, kolik jejích slotů zůstane zablokovaných. Každá další truhla toho druhu, kterou postavíš, bude mít tolik slotů zablokovaných.
exteros-qol-belt-brush-enabled=Když držíš v ruce pás, podzemní pás, potrubí do země, nakladač, zeď, tepelné potrubí nebo podavač (inserter), malé okénko ti dovolí zvolit počet pruhů a kurzor se nahradí dočasným plánem, který jich najednou vykreslí vedle sebe. Výchozí: CONTROL + SHIFT + B přepíná tvar, CONTROL + SHIFT + N přepíná balancery, CONTROL + kolečko myši (nebo PAD + / PAD -) mění šířku.
exteros-qol-rate-calculator-enabled=Označ stroje nástrojem Rate Calculator (ALT + X nebo tlačítko v liště zkratek) a uvidíš jejich celkovou výrobu a spotřebu. Podle módu Rate Calculator od raiguarda.
exteros-qol-rcalc-dismiss-tool-on-selection=Po označení oblasti se nástroj Rate Calculator sám odloží z kurzoru.
exteros-qol-rcalc-show-calculation-errors=Když výpočet narazí na problém (stroj bez paliva, bez receptu…), okno ho vypíše.
exteros-qol-rcalc-show-power-consumption=Zobrazí v okně spotřebu elektřiny. Ve výchozím stavu vypnuto, protože to málokdy potřebuješ.
exteros-qol-rcalc-default-gui-location=Okno vrátíš na výchozí místo kdykoliv kliknutím prostředním tlačítkem na jeho záhlaví.
exteros-qol-rcalc-default-timescale=V jaké jednotce se ukáží hodnoty v nově otevřeném okně. V okně ji pak můžeš kdykoliv změnit.
exteros-qol-rcalc-show-completion-checkboxes=Přidá ke každému řádku zaškrtávátko, abys si při práci se seznamem mohl odškrtávat hotové položky.
exteros-qol-rcalc-show-intermediate-breakdowns=Zobrazí sloupec s výrobou a spotřebou každého meziproduktu.
exteros-qol-rcalc-show-pollution=Zobrazí v okně množství znečištění.
exteros-qol-ghost-builder-enabled=Když kurzorem najedeš na ducha (nebo na reálnou budovu označenou k vylepšení) a máš u sebe správný předmět, postaví nebo vylepší se okamžitě, bez nutnosti ho nejdřív vzít do ruky. Výchozí klávesa pro zapnutí/vypnutí CONTROL + SHIFT + G.
exteros-qol-ghost-builder-entities=Postaví ducha budovy, na kterou najedeš kurzorem, pokud u sebe máš potřebný předmět.
exteros-qol-ghost-builder-upgrades=Provede požadavek plánovače vylepšení na budově, na kterou najedeš kurzorem, pokud u sebe máš cílový předmět, a vrátí ti nahrazený předmět zpět.
exteros-qol-ghost-builder-tiles=Postaví ducha dlaždice, na kterého najedeš kurzorem, pokud u sebe máš potřebný předmět, a vrátí ti, co by vypadlo z nahrazené dlaždice.
exteros-qol-ghost-builder-modules=Doplní prázdné sloty na moduly budovy z tvého inventáře podle jejích požadavků na předměty: hned po postavení Ghost Builderem, po normálním postavení, a i když najedeš kurzorem na už postavený stroj, který na moduly stále čeká.
exteros-qol-planner-menu-enabled=Přidá klávesu, která otevře okno se všemi plánovači a výběrovými nástroji ve hře, vanilla i moddovanými — kliknutím si jeden vezmeš do ruky — a klávesy pro cyklení mezi nimi. Výchozí zapínací klávesa CONTROL + B, cyklení ALT + Q / ALT + SHIFT + Q.
exteros-qol-planner-menu-columns=Kolik tlačítek na řádek okno Planner Menu zobrazí.
exteros-qol-tape-measure-enabled=Přidá výběrový nástroj (dostupný i z Planner Menu), který po tažení obdélníku ukáže jeho šířku, výšku a počet dlaždic; SHIFT + tažení ponechá vykreslené měření, dokud neuděláš další. Výchozí klávesa CONTROL + SHIFT + M.

