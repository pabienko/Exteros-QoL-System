[mod-setting-description]
exteros-qol-debug-enabled=Zobrazuje detailní technické logy v konzoli.
exteros-qol-squeak-through-enabled=Dovolí ti projít mezi budovami, potrubím a stromy díky zmenšeným kolizním boxům.
exteros-qol-searchlight-flashlight-global-scale=Násobič velikosti kužele svítilny i záře kolem všech hráčů. Výchozí 1 = vanilla; startovní nastavení, jeho změna znovu načte uloženou hru.
exteros-qol-searchlight-flashlight-global-intensity=Násobič jasu svítilny u všech hráčů. 1 = vanilla, až do 1.6667 (strop enginu); startovní nastavení, jeho změna znovu načte uloženou hru.
exteros-qol-searchlight-flashlight-global-color=Barva svítilny u všech hráčů, jako hex kód, například #FFCC88. Prázdné pole = vanilla barva; startovní nastavení, jeho změna znovu načte uloženou hru.
exteros-qol-bottleneck-enabled=Vykreslí barevné světlo stavu na sestavovacích strojích, pecích a raketových silech: práce, zastavení, málo energie, nebo plný výstup. Jen prototypová grafika, bez zátěže výkonu.
exteros-qol-bottleneck-mining-drills=Vykreslí světlo stavu i na těžebních vrtácích.
exteros-qol-bottleneck-size=Jak velké se světlo stavu vykresluje.
exteros-qol-bottleneck-glow=Přidá slabý svit, aby šlo světlo vidět i v noci.
exteros-qol-bottleneck-override=Přepíše barvy stavu nastavené jiným módem, místo aby je ponechal.
exteros-qol-bottleneck-color-working=Barva pracujícího stroje, jako hex kód, například #00FF00.
exteros-qol-bottleneck-color-full-output=Barva stroje s plným výstupem, jako hex kód, například #FFFF00.
exteros-qol-bottleneck-color-stopped=Barva zastaveného stroje (chybí vstupy, chybí zdroje, nebo je vypnutý), jako hex kód, například #FF0000.
exteros-qol-bottleneck-color-low-power=Barva stroje s nízkým nebo chybějícím napájením, jako hex kód, například #FF8000.

