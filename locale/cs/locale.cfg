[mod-name]
Exteros-QoL-System=Exterosův QoL systém

[mod-description]
Exteros-QoL-System=Modulární balíček QoL pro Factorio 2.0 a 2.1, každá funkce se zapíná zvlášť: Rate Calculator, Even Distribution, Force Insert, Belt Brush, Belt Reverser, Squeak Through, Auto Deconstruct, Inventory Repair, Copy Chest, Chest Limit, Time Controls, Auto Inventory Sort, Held Item Count, Player Searchlight, Wire Shortcuts, Planner Zapper, Quality Scroll, Renamer, Player Colors, Auto Alt Mode, Ghost Builder, Planner Menu a Tape Measure, vše nastavitelné v jednom Settings Hubu.

