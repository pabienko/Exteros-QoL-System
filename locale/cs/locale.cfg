[mod-setting-description]
exteros-qol-even-distribution-enabled=Povolí rovnoměrné rozdělování předmětů při použití Ctrl + Klik.
exteros-qol-debug=Zobrazuje detailní technické logy v konzoli.
exteros-qol-squeak-through-enabled=Umožňuje hráči procházet mezi budovami, potrubím a stromy díky mírnému zmenšení kolizních boxů.
exteros-qol-cheat-mode-enabled=Povolí doplňková nastavení pro cheaty (dosah, rychlost atd.). Musí být ZAPNUTO pro použití jakýchkoliv cheatů.
exteros-qol-auto-deconstruct-enabled=Automaticky označí těžaře (minery) k dekonstrukci, jakmile vytěží veškerou rudu.
exteros-qol-inventory-repair-enabled=Automaticky opravuje poškozené umístitelné předměty ve vašem inventáři pomocí opravných sad.
exteros-qol-time-controls-enabled=Přidá tlačítka do horního levého rohu pro ovládání rychlosti hry.
exteros-qol-auto-alt-enabled=Automaticky zapne Alt režim (ikony na entitách) při připojení do hry.
exteros-qol-auto-sort-inventory=Automaticky třídit kontejnery při otevření. SHIFT+I vždy ručně utřídí bez ohledu na toto nastavení.
exteros-qol-item-count-enabled=Zobrazí počet drženého předmětu v inventáři (a kufru vozidla) uprostřed obrazovky.
exteros-qol-searchlight-enabled=Postava se automaticky otočí směrem k vybrané entitě.
exteros-qol-force-insert-enabled=Umožní rychlému přesunu (fast transfer) vložit předměty i přes červený limit (bar) kontejneru. Funguje s SHIFT+klik i CTRL+klik, i při tažení přes entity ve světě.
exteros-qol-force-insert-always=Když je vypnuto, přesun se vynutí až ve chvíli, kdy se už nic nevejde; druhé kliknutí do konce okna akce ho vynutí i tehdy, když místo ještě je. Když je zapnuto, každý přesun limit ignoruje.
exteros-qol-force-insert-window=Jak dlouho se kliknutí nebo tažení počítá jako jedna souvislá akce. (60 = 1 sekunda)
exteros-qol-wire-shortcuts-enabled=Přidá klávesu, která vezme kabel do ruky a přepíná mezi jeho druhy. Výchozí ALT + W, přemapovat lze v Možnosti > Ovládání > Módy.
exteros-qol-wire-cycle-copper=Přepíná mezi červeným, zeleným a měděným kabelem. Když je vypnuto, střídá jen červený a zelený.
exteros-qol-planner-zapper-enabled=Upuštěný plán, kniha plánů, plánovač demolice, plánovač vylepšení nebo výběrový nástroj se zničí místo toho, aby zůstal ležet na zemi.
exteros-qol-quality-scroll-enabled=Přidá klávesy, které vymění předmět v ruce za tentýž předmět jiné kvality, pokud ho máš v inventáři. Výchozí CONTROL + SHIFT + kolečko myši.
exteros-qol-hub-button-visible=Zobrazí tlačítko QoL v levém horním rohu. Když je vypnuté, hub otevřeš klávesovou zkratkou (výchozí SHIFT + E), změnit ji lze v Možnosti > Ovládání > Módy.
exteros-qol-cheat-productivity-unlocked=Umožňuje použít produktivity moduly ve VŠECH receptech. (Vyžaduje Cheat Mód)
exteros-qol-cheat-productivity-cap=Nastavuje maximální procento produktivity pro recepty. (Vyžaduje Cheat Mód)
exteros-qol-cheat-stack-size-mode=Zvolte, zda chcete násobit původní velikosti stacků nebo nastavit absolutní hodnotu. (Vyžaduje Cheat Mód)
exteros-qol-cheat-stack-size-value=Násobitel nebo absolutní hodnota pro velikost stacků. (Vyžaduje Cheat Mód)
even-distribution-ticks=Doba (v ticích), po kterou mod čeká od posledního kliknutí, než rozdělí předměty. (60 = 1 sekunda)
even-distribution-swap-balance=Pokud je povoleno, Ctrl+M1 bude režim Balancování a Ctrl+M2 bude režim Rovnoměrný.
cheat-reach-distance=Zvyšuje vzdálenost pro stavění, braní předmětů a lootování.
cheat-crafting-speed=Zvyšuje rychlost ruční výroby hráče.
cheat-mining-speed=Zvyšuje rychlost ruční těžby hráče.
cheat-inventory-bonus=Přidá extra sloty do inventáře hráče.
exteros-qol-inventory-repair-interval=Jak často (v ticích) mod kontroluje inventář a provede jeden krok opravy.
exteros-qol-inventory-repair-order=Zvolte, zda se mají nejdříve použít nejslabší nebo nejsilnější opravné sady.
exteros-qol-copy-chest-enabled=Přidá klávesy, které přesunou celý obsah jedné nádoby do druhé. Výchozí SHIFT + C a SHIFT + V, přemapovat lze v Možnosti > Ovládání > Módy.
exteros-qol-copy-chest-between-surfaces=Dovolí přesouvat obsah mezi nádobami na různých povrchech. Když je vypnuto, obě nádoby i hráč musí být na stejném povrchu.
exteros-qol-belt-reverser-enabled=Přidá klávesu, která otočí směr celé dopravní linky včetně podzemních pásů a nakladačů. Výchozí CONTROL + R, přemapovat lze v Možnosti > Ovládání > Módy. Automaticky se vypne, pokud máš nainstalovaný mód, který otáčení pásů už umí.
exteros-qol-player-colors-enabled=Nastaví barvu tvojí postavy a chatu při prvním vytvoření postavy a pak vždy, když tahle nastavení změníš.
exteros-qol-character-color=Barva tvojí postavy. Vyber „custom" pro vlastní hex kód níže, nebo „default" pro ponechání současné barvy.
exteros-qol-character-color-hex=Vlastní barva jako hex kód, například #E08A2E. Použije se jen tehdy, když je nastavení výše na „custom".
exteros-qol-chat-color=Barva tvého jména v chatu. Vyber „custom" pro vlastní hex kód níže, nebo „default" pro ponechání současné barvy.
exteros-qol-chat-color-hex=Vlastní barva chatu jako hex kód, například #4A7FD9. Použije se jen tehdy, když je nastavení výše na „custom".

